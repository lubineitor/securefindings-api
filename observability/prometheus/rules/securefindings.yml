groups:
  - name: securefindings-api
    interval: 30s
    rules:
      - alert: SecureFindingsApiUnavailable
        expr: up{job="securefindings-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: SecureFindings API no responde
          description: Prometheus no puede recopilar las métricas de la API durante al menos un minuto; puede estar caída o fallar la autenticación del scraper.

      - alert: RateLimiterRedisUnavailable
        expr: increase(securefindings_rate_limit_requests_total{job="securefindings-api", outcome="unavailable"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: El rate limiter no puede acceder a Redis
          description: La API ha rechazado peticiones porque Redis no estaba disponible durante los últimos cinco minutos.

      - alert: RateLimitBurst
        expr: increase(securefindings_rate_limit_requests_total{job="securefindings-api", outcome="rate_limited"}[5m]) >= 20
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Aumento de peticiones limitadas
          description: Se han limitado al menos 20 peticiones en cinco minutos.

      - alert: ApiHighServerErrorRate
        expr: (sum(rate(http_server_requests_seconds_count{job="securefindings-api", status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="securefindings-api"}[5m])), 0.000001)) > 0.05 and sum(increase(http_server_requests_seconds_count{job="securefindings-api"}[5m])) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Aumentaron los errores 5xx
          description: Más del cinco por ciento de las respuestas fueron 5xx durante cinco minutos, con más de 20 peticiones observadas.

      - alert: ApiHighAverageLatency
        expr: (sum(rate(http_server_requests_seconds_sum{job="securefindings-api"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="securefindings-api"}[5m])), 0.001)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Aumentó la latencia media de la API
          description: La latencia media de las peticiones superó un segundo durante cinco minutos.