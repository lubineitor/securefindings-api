global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/securefindings.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: securefindings-api
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - host.docker.internal:8080
    oauth2:
      client_id: securefindings-prometheus
      client_secret_file: /run/secrets/prometheus_client_secret
      token_url: http://keycloak:8080/realms/securefindings/protocol/openid-connect/token