services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: securefindings-prometheus
    profiles:
      - observability
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - securefindings_prometheus_data:/prometheus
    secrets:
      - prometheus_client_secret
    depends_on:
      keycloak:
        condition: service_started

  grafana:
    image: grafana/grafana:13.2.4
    container_name: securefindings-grafana
    profiles:
      - observability
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - securefindings_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

secrets:
  prometheus_client_secret:
    file: ./.secrets/prometheus-client-secret.txt

volumes:
  securefindings_prometheus_data:
  securefindings_grafana_data:
