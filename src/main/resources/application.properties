spring.application.name=securefindings-api

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/securefindings}

# Límite de peticiones por cliente
securefindings.rate-limit.max-requests=${SECUREFINDINGS_RATE_LIMIT_MAX_REQUESTS:60}
securefindings.rate-limit.window=${SECUREFINDINGS_RATE_LIMIT_WINDOW:60s}
securefindings.rate-limit.max-tracked-clients=${SECUREFINDINGS_RATE_LIMIT_MAX_TRACKED_CLIENTS:100000}

# Identificador de correlación en los logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId}] %logger{36} - %msg%n

# Redis para el rate limiter distribuido
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.data.redis.connect-timeout=${SPRING_DATA_REDIS_CONNECT_TIMEOUT:1s}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}

spring.security.oauth2.resourceserver.jwt.audiences[0]=${JWT_AUDIENCE:securefindings-api}

# Exponer por HTTP únicamente los endpoints de salud
management.endpoints.web.exposure.include=health

# No revelar detalles ni componentes en las respuestas de salud
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Activar probes de liveness y readiness en todos los entornos
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# Liveness solo evalúa el estado interno de la aplicación
management.endpoint.health.group.liveness.include=livenessState

# Readiness también depende de PostgreSQL y Redis
management.endpoint.health.group.readiness.include=readinessState,db,redis