groups:
  - name: securefindings-api
    rules:
      - alert: SecureFindingsApiUnavailable
        expr: up{job="securefindings-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: SecureFindings API no responde
          description: Prometheus no puede obtener las métricas de la API durante más de un minuto.

      - alert: SecureFindingsHigh5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="securefindings-api",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="securefindings-api"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Tasa elevada de errores 5xx
          description: Más del 5 % de las solicitudes devuelve errores 5xx durante cinco minutos.

      - alert: SecureFindingsRateLimiterUnavailable
        expr: increase(securefindings_rate_limit_requests_total{job="securefindings-api",outcome="unavailable"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Rate limiter no disponible
          description: El rate limiter rechazó solicitudes porque Redis no estaba disponible.

      - alert: SecureFindingsHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_server_requests_seconds_bucket{job="securefindings-api"}[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Latencia p95 superior a un segundo
          description: El percentil 95 de latencia supera un segundo durante cinco minutos.